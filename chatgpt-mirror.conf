# ============================================================================
#  *.example.com  ->  ChatGPT 上游站点
#
#  按“子域名前缀”选择上游，反向代理 + 改写页面/脚本中的域名：
#      chat.|www.|gpt.|<其他未知前缀>  ->  chatgpt.com
#      api      ->  api.openai.com
#      auth     ->  auth.openai.com
#      ab       ->  ab.chatgpt.com
#      cdn      ->  cdn.oaistatic.com
#      files    ->  files.oaiusercontent.com
#      platform ->  platform.openai.com
#      help     ->  help.openai.com
#      status   ->  status.openai.com
#      sora     ->  sora.chatgpt.com
#
#  建议放置：<openresty>/nginx/conf/sites-enabled/chatgpt-mirror.conf
#  回源：由 CDN 终止 TLS 后以 HTTP 回源到本机 80，必须保留原始 Host。
# ============================================================================

# 解析变量 proxy_pass 的目标主机（nginx 对变量形式的 proxy_pass 必须在运行时解析）
resolver 223.5.5.5 119.29.29.29 1.1.1.1 valid=300s ipv6=off;
resolver_timeout 5s;

# 未登录会话归档（内存，仅本机 OpenResty 使用）
lua_shared_dict gpt_archive 16m;

# 从 Host 中取出前缀：chat.example.com -> chat
map $host $gpt_prefix {
    default                                       "";
    ~^(?<p>[a-z0-9-]+)\.example\.com$     $p;
}

# 前缀 -> 上游主机（未知前缀回落到 chatgpt.com）
map $gpt_prefix $gpt_upstream {
    default        chatgpt.com;
    chat           chatgpt.com;
    www            chatgpt.com;
    gpt            chatgpt.com;
    api            api.openai.com;
    auth           auth.openai.com;
    ab             ab.chatgpt.com;
    cdn            cdn.oaistatic.com;
    persistent     persistent.oaistatic.com;
    files          files.oaiusercontent.com;
    platform       platform.openai.com;
    developers     developers.openai.com;
    help           help.openai.com;
    status         status.openai.com;
    sora           sora.chatgpt.com;
    ws             ws.chatgpt.com;
    wss            ws.chatgpt.com;
}

# Websocket / SSE
# 只有 CDN 静态资源不需要 sub_filter，可以直接接收上游压缩内容
map $gpt_upstream $gpt_accept_encoding {
    default                                "";
    cdn.oaistatic.com                      $http_accept_encoding;
    persistent.oaistatic.com               $http_accept_encoding;
    files.oaiusercontent.com               $http_accept_encoding;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# 浏览器带来的 Origin 属于镜像域名时，改写成上游域名
map $http_origin $gpt_origin_prefix {
    default                                              "";
    "~^https?://(?<op>[a-z0-9-]+)\.example\.com$"  $op;
}
map $gpt_origin_prefix $gpt_origin_out {
    default  "";
    "~."     "https://$gpt_upstream";
}

# 同理改写 Referer
map $http_referer $gpt_referer_out {
    default  $http_referer;
    "~*^https?://[a-z0-9-]+\.example\.com(?<rp>/.*)?$"  "https://$gpt_upstream$rp";
}

server {
    listen      80;
    listen      [::]:80;
    server_name example.com *.example.com;

    # 必须带前缀：apex 与任意非目标域一律 404，不代理
    if ($host !~* ^[a-z0-9-]+\.example\.com$) {
        return 404;
    }

    access_log /www/wwwlogs/chatgpt.example.access.log;
    error_log  /www/wwwlogs/chatgpt.example.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/x-javascript application/xml image/svg+xml application/manifest+json;

    # 前面的 CDN（EdgeOne）会复用回源长连接；空闲超时必须大于它的复用窗口，
    # 否则 CDN 复用到已被关闭的连接就会 502
    keepalive_timeout   300s;
    keepalive_requests  10000;

    # 登录后浏览器/上游会带很长的 Cookie（session-token 分片能到 8~12KB），
    # 默认 8k 头缓冲会直接 400，这里放宽
    client_header_buffer_size   16k;
    large_client_header_buffers 8 32k;

    client_max_body_size 100m;
    client_body_buffer_size 1m;

    # ChatGPT 会下发大量 Set-Cookie，默认 4k 头缓冲不够
    proxy_buffer_size       32k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;

    # ---- 请求头改写 ---------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $gpt_upstream;
    proxy_set_header Origin            $gpt_origin_out;
    proxy_set_header Referer           $gpt_referer_out;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;   # 浏览器侧是 https（EdgeOne 终止）
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header User-Agent        $http_user_agent;

    # 让上游返回未压缩内容，sub_filter 才能改写；压缩由本机 gzip 重新完成
    proxy_set_header Accept-Encoding   $gpt_accept_encoding;

    # Cloudflare Workers 中继过来的请求会强制带上 Cf-Worker / Cf-Visitor 等头，
    # 上游（OpenAI）会判定成代理/VPN 流量直接返回 403（本机 curl 加这几个头必 403）。
    # 置空 = nginx 不向上游发送这些头。
    proxy_set_header Cf-Worker    "";
    proxy_set_header Cf-Visitor   "";
    proxy_set_header Cf-Ew-Via    "";
    proxy_set_header Cf-Ray       "";
    proxy_set_header Cdn-Loop     "";

    # ---- 上游 TLS / 超时 ----------------------------------------------------
    proxy_ssl_server_name on;
    proxy_ssl_name        $gpt_upstream;
    proxy_ssl_protocols   TLSv1.3;
    proxy_ssl_session_reuse on;

    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # SSE / 流式响应不要缓冲
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_cache             off;

    # 上游（Cloudflare）偶发 TLS 握手被 RST：自动换 IP 重试一次，避免直接 502
    error_page 502 504 = @gpt_retry;
    location @gpt_retry {
        internal;
        if ($request_method !~ ^(GET|HEAD)$) { return 502; }
        proxy_pass https://$gpt_upstream;
    }

    # ---- 隐藏上游与本镜像冲突的响应头 --------------------------------------
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Alt-Svc;
    proxy_hide_header Public-Key-Pins;
    proxy_hide_header Report-To;
    proxy_hide_header Reporting-Endpoints;
    proxy_hide_header NEL;

    # ---- 3xx Location 改写 --------------------------------------------------
    proxy_redirect https://auth.openai.com/          https://auth.example.com/;
    proxy_redirect http://auth.openai.com/           https://auth.example.com/;
    proxy_redirect https://api.openai.com/           https://api.example.com/;
    proxy_redirect https://platform.openai.com/      https://platform.example.com/;
    proxy_redirect https://help.openai.com/          https://help.example.com/;
    proxy_redirect https://cdn.oaistatic.com/        https://cdn.example.com/;
    proxy_redirect https://persistent.oaistatic.com/ https://persistent.example.com/;
    proxy_redirect https://developers.openai.com/    https://developers.example.com/;
    proxy_redirect https://files.oaiusercontent.com/ https://files.example.com/;
    proxy_redirect https://ab.chatgpt.com/           https://ab.example.com/;
    proxy_redirect https://sora.chatgpt.com/         https://sora.example.com/;
    proxy_redirect https://chatgpt.com/              https://chat.example.com/;
    proxy_redirect http://chatgpt.com/               https://chat.example.com/;

    # ---- Cookie Domain 收敛到镜像父域 --------------------------------------
    proxy_cookie_domain chatgpt.com          .example.com;
    proxy_cookie_domain .chatgpt.com         .example.com;
    proxy_cookie_domain api.openai.com       .example.com;
    proxy_cookie_domain auth.openai.com      .example.com;
    proxy_cookie_domain platform.openai.com  .example.com;
    proxy_cookie_domain help.openai.com      .example.com;
    proxy_cookie_domain ab.chatgpt.com       .example.com;
    proxy_cookie_domain sora.chatgpt.com     .example.com;
    proxy_cookie_domain openai.com           .example.com;
    proxy_cookie_domain .openai.com          .example.com;
    proxy_cookie_domain cdn.oaistatic.com    .example.com;
    proxy_cookie_domain oaistatic.com        .example.com;
    proxy_cookie_domain .oaistatic.com       .example.com;
    proxy_cookie_domain files.oaiusercontent.com  .example.com;
    proxy_cookie_domain oaiusercontent.com   .example.com;
    proxy_cookie_domain .oaiusercontent.com  .example.com;

    # ---- 页面/脚本内域名改写（先具体，后通用） ------------------------------
    sub_filter_once   off;
    sub_filter_types  text/css text/plain text/xml application/xml application/json application/javascript application/x-javascript text/javascript;

    sub_filter 'cdn.oaistatic.com'         'cdn.example.com';
    sub_filter 'persistent.oaistatic.com'  'persistent.example.com';
    sub_filter 'developers.openai.com'     'developers.example.com';
    sub_filter 'platform.openai.com'       'platform.example.com';
    sub_filter 'auth.openai.com'           'auth.example.com';
    sub_filter 'api.openai.com'            'api.example.com';
    sub_filter 'help.openai.com'           'help.example.com';
    sub_filter 'status.openai.com'         'status.example.com';
    sub_filter 'sora.chatgpt.com'          'sora.example.com';
    sub_filter 'ws.chatgpt.com'            'ws.example.com';
    sub_filter 'ab.chatgpt.com'            'ab.example.com';
    sub_filter 'chatgpt.com'               'chat.example.com';

    # 未登录会话归档浮层（刷新后可查看上次会话）
    sub_filter '</body>' '<script src="/__gpt/panel.js"></script></body>';

    location / {
        # 上游会校验请求体里的 app_name / page url / clientContextualInfo，
        # 这里把镜像域名还原成真实上游域名，否则发送消息会 400。
        access_by_lua_block {
            -- 每个浏览器一个 sid，用于归档未登录会话
            local sid = ngx.var.cookie_gpt_sid
            if not sid or sid == "" then
                sid = ngx.md5(ngx.now() .. ngx.var.request_id .. tostring(math.random(1, 2147483647)))
                ngx.ctx.new_sid = sid
            end
            ngx.ctx.sid = sid

            -- 浏览器里残留的超大 Cookie（session-token 分片、cf_clearance 等）
            -- 会让回源请求头超过边缘限制，直接被拒成 400/502。这里只保留必要的小 Cookie。
            do
                local rawck = ngx.var.http_cookie
                if rawck and #rawck > 1024 then
                    local big = {
                        ["cf_clearance"] = true, ["__cf_bm"] = true, ["__cflb"] = true,
                        ["_cfuvid"] = true, ["_dd_s_v2"] = true, ["oai-sc"] = true,
                        ["g_state"] = true, ["__cfruid"] = true, ["__oai"] = true,
                    }
                    local keepname = {
                        ["gpt_sid"] = true, ["oai-did"] = true, ["oai-device-id"] = true,
                        ["_account"] = true, ["_account_is_fedramp"] = true,
                        ["oai-hlib"] = true, ["oai-nav-state"] = true, ["oai-mweb-origin"] = true,
                        ["oai-mweb-route"] = true, ["oai_pl_permission_state"] = true,
                        ["oai-client-session-epoch"] = true, ["oai-did-first-seen"] = true,
                        ["codex_sidebar_width"] = true, ["codex_sidebar_state"] = true,
                        ["__host-next-auth.csrf-token"] = true,
                        ["__Secure-next-auth.callback-url"] = true,
                    }
                    local parts, total = {}, 0
                    for part in rawck:gmatch("[^;]+") do
                        local pv = part:gsub("^%s+", ""):gsub("%s+$", "")
                        local name, val = pv:match("^([^=]+)=(.*)$")
                        if name then
                            local n = name:lower()
                            local drop = #val > 1000 or big[n] or n:find("session%-token")
                                or n:find("^_ua") or n:find("^_um") or n:find("^__oai")
                            if not drop then
                                parts[#parts + 1] = { n, pv, #pv }
                                total = total + #pv + 2
                            end
                        end
                    end
                    local keep = parts
                    if total > 4096 then
                        keep = {}
                        for _, it in ipairs(parts) do
                            if keepname[it[1]] then keep[#keep + 1] = it end
                        end
                    end
                    local out = {}
                    for _, it in ipairs(keep) do out[#out + 1] = it[2] end
                    local newck = table.concat(out, "; ")
                    if #newck > 4096 then newck = "" end
                    if newck == "" then newck = "oai-did=" .. sid end
                    local changed = (#newck ~= #rawck)
                    if changed then
                        pcall(ngx.req.set_header, "Cookie", newck)
                        ngx.log(ngx.WARN, "COOKIEFIX in=", #rawck, " out=", #newck)
                    end
                end
            end

            -- 已导入的官方登录 Cookie：只发给官方 OpenAI 域名，避免泄露给 CDN
            local ac = ngx.shared.gpt_archive:get("authcur:" .. sid)
                or ngx.shared.gpt_archive:get("auth:" .. sid)
            local up = ngx.var.gpt_upstream
            if ac and (up == "chatgpt.com" or up == "api.openai.com" or up == "auth.openai.com") then
                local p = nil
                if ac:sub(1, 1) == "{" then
                    local okp, pp = pcall(require("cjson").decode, ac)
                    if okp and type(pp) == "table" then p = pp end
                end
                local cookie = p and p.cookie or (p == nil and ac or nil)
                if cookie and #cookie <= 16384 and not cookie:find("[\r\n]") then
                    pcall(ngx.req.set_header, "Cookie", cookie)
                end
                if p and up ~= "auth.openai.com" then
                    if p.auth and p.auth ~= "" then
                        pcall(ngx.req.set_header, "Authorization", "Bearer " .. p.auth)
                    end
                    if p.account_id and p.account_id ~= "" then
                        pcall(ngx.req.set_header, "chatgpt-account-id", p.account_id)
                    end
                    if p.device_id and p.device_id ~= "" then
                        pcall(ngx.req.set_header, "oai-device-id", p.device_id)
                        pcall(ngx.req.set_header, "oai-did", p.device_id)
                    end
                end
            end

            local ct = ngx.var.content_type or ""
            if ct:find("application/json", 1, true)
                or ct:find("application/x-www-form-urlencoded", 1, true)
                or ct:find("text/plain", 1, true) then
                ngx.req.read_body()
                local body = ngx.req.get_body_data()
                if body then
                    local hosts = {
                        ["chat.example.com"] = "chatgpt.com",
                        ["www.example.com"] = "chatgpt.com",
                        ["gpt.example.com"] = "chatgpt.com",
                        ["api.example.com"] = "api.openai.com",
                        ["auth.example.com"] = "auth.openai.com",
                        ["ab.example.com"] = "ab.chatgpt.com",
                        ["cdn.example.com"] = "cdn.oaistatic.com",
                        ["persistent.example.com"] = "persistent.oaistatic.com",
                        ["files.example.com"] = "files.oaiusercontent.com",
                        ["platform.example.com"] = "platform.openai.com",
                        ["developers.example.com"] = "developers.openai.com",
                        ["help.example.com"] = "help.openai.com",
                        ["status.example.com"] = "status.openai.com",
                        ["sora.example.com"] = "sora.chatgpt.com",
                    }
                    -- 当前请求的实际前缀（可能是任意自定义前缀）
                    hosts[ngx.var.host] = ngx.var.gpt_upstream

                    local new = body
                    for mirror, upstream in pairs(hosts) do
                        if new:find(mirror, 1, true) then
                            local out, i = {}, 1
                            while true do
                                local a, b = new:find(mirror, i, true)
                                if not a then out[#out + 1] = new:sub(i); break end
                                out[#out + 1] = new:sub(i, a - 1)
                                out[#out + 1] = upstream
                                i = b + 1
                            end
                            new = table.concat(out)
                        end
                    end
                    if new ~= body then
                        ngx.req.set_body_data(new)
                    end

                    -- 未登录会话：解析 conversationState 里的会话 id，并处理“继续旧会话”
                    local uri = ngx.var.uri
                    local is_conv = (uri == "/unauth-mweb/conversation/prepare"
                        or uri == "/unauth-mweb/conversation/updates")
                    if is_conv then
                        local cjson = require("cjson")
                        local raw = new:match("conversationState=([^&]*)")
                        local obj
                        local dec
                        if raw then
                            dec = ngx.unescape_uri(raw)
                            local ok, o = pcall(cjson.decode, dec)
                            if ok and type(o) == "table" then obj = o end
                        end
                        if obj and obj.backendConversationId then
                            ngx.ctx.backend_id = obj.backendConversationId
                        end
                        if obj and obj.parentMessageId and obj.parentMessageId ~= "client-created-root" then
                            ngx.ctx.state_parent = obj.parentMessageId
                        end

                        if uri == "/unauth-mweb/conversation/updates" then
                            ngx.ctx.is_updates = true
                            local h = ngx.req.get_headers()
                            ngx.ctx.affinity = h["x-web-mobile-conversation-document-affinity"]
                            local p = new:match("prompt=([^&]*)")
                            if p then ngx.ctx.prompt = ngx.unescape_uri(p) end
                            local sess = new:match("oai%-session%-id=([^&]*)")
                            if sess then ngx.ctx.oai_session = sess end
                            local um = new:match("userMessageId=([^&]*)")
                            if um then ngx.ctx.user_msg_id = um end
                        end

                        -- 面板里点了“继续”：复用归档的会话上下文，真正续上旧会话。
                        local active = ngx.shared.gpt_archive:get("active:" .. sid)
                        if active and uri == "/unauth-mweb/conversation/updates" then
                            local listraw = ngx.shared.gpt_archive:get("convs:" .. sid)
                            local entry
                            if listraw then
                                local ok2, l = pcall(cjson.decode, listraw)
                                if ok2 and type(l) == "table" then
                                    for _, c in ipairs(l) do
                                        if c.id == active then entry = c; break end
                                    end
                                end
                            end
                            if entry and obj then
                                local uc = 0
                                for _, m in ipairs(entry.messages or {}) do
                                    if m.author and m.author.role == "user" then uc = uc + 1 end
                                end
                                ngx.ctx.resume_entry_id = active
                                -- 直接在原始 JSON 字符串上改字段，避免 cjson 把空数组编码成 {}
                                local st = dec
                                if st:find('"backendConversationId"') then
                                    st = st:gsub('"backendConversationId"%s*:%s*"[^"]*"',
                                        '"backendConversationId":"' .. active .. '"', 1)
                                else
                                    st = st:gsub("^%s*{", '{"backendConversationId":"' .. active .. '",', 1)
                                end
                                st = st:gsub('"parentMessageId"%s*:%s*"[^"]*"',
                                    '"parentMessageId":"' .. (entry.parentId or "client-created-root") .. '"', 1)
                                st = st:gsub('"userMessageCount"%s*:%s*%d+',
                                    '"userMessageCount":' .. uc, 1)
                                local enc = ngx.escape_uri(st)
                                new = new:gsub("conversationState=[^&]*", function()
                                    return "conversationState=" .. enc
                                end, 1)
                                if entry.session then
                                    new = new:gsub("oai%-session%-id=[^&]*", function()
                                        return "oai-session-id=" .. ngx.escape_uri(entry.session)
                                    end, 1)
                                    ngx.req.set_header("oai-session-id", entry.session)
                                    ngx.ctx.oai_session = entry.session
                                end
                                if entry.affinity then
                                    ngx.req.set_header("x-web-mobile-conversation-document-affinity", entry.affinity)
                                    ngx.ctx.affinity = entry.affinity
                                end
                                ngx.req.set_body_data(new)
                            end
                            ngx.shared.gpt_archive:delete("active:" .. sid)
                        end
                    end
                end
            end
        }

        header_filter_by_lua_block {
            -- 不要把超大 / 会话绑定的 Cookie 写到浏览器，否则下次请求头直接爆炸
            local c = ngx.header["Set-Cookie"]
            if c then
                local list = type(c) == "table" and c or { c }
                local dropname = {
                    ["cf_clearance"] = true, ["__cf_bm"] = true, ["__cflb"] = true,
                    ["_cfuvid"] = true, ["_dd_s_v2"] = true, ["oai-sc"] = true,
                    ["g_state"] = true, ["__cfruid"] = true,
                }
                local kept = {}
                for _, v in ipairs(list) do
                    local name, val = v:match("^%s*([^=]+)=(.*)$")
                    local n = (name or ""):lower()
                    local drop = false
                    if #v > 1200 then drop = true end
                    if dropname[n] or n:find("session%-token") or n:find("^_ua")
                        or n:find("^_um") or n:find("^__oai") then
                        drop = true
                    end
                    if not drop then kept[#kept + 1] = v end
                end
                local sid = ngx.ctx.new_sid
                if sid then
                    kept[#kept + 1] = "gpt_sid=" .. sid .. "; Path=/; Max-Age=31536000; SameSite=Lax"
                end
                ngx.header["Set-Cookie"] = kept
            end
        }

        # 从 conversation/updates 的 SSE 里提取用户 prompt 和最终回答，写入归档
        body_filter_by_lua_block {
            if not ngx.ctx.is_updates then return end
            local chunk = ngx.arg[1]
            if chunk and #chunk > 0 then
                ngx.ctx.sse = (ngx.ctx.sse or "") .. chunk
                if #ngx.ctx.sse > 2000000 then
                    ngx.ctx.sse = ngx.ctx.sse:sub(-1000000)
                end
            end
            if not ngx.arg[2] then return end
            local buf = ngx.ctx.sse or ""
            ngx.ctx.sse = nil
            if buf == "" then return end
            -- 续聊失败（旧会话已在服务端消失）时不要污染归档
            if buf:find('"conversation_not_found"', 1, true)
                or buf:find('"upstreamHttpStatus":404', 1, true) then
                return
            end

            local cjson = require("cjson")
            local convid, amsg_id, atext
            local texts, order = {}, {}
            for line in buf:gmatch("[^\n]+") do
                local ok, o = pcall(cjson.decode, line)
                if ok and type(o) == "table" then
                    if o.type == "control" and type(o.detail) == "table"
                        and o.detail.kind == "conversation-id" then
                        convid = o.detail.conversationId
                    elseif o.type == "content" then
                        local t = o.fallbackMarkdown
                        if type(t) ~= "string" or t == "" then t = o.markdown end
                        if type(t) ~= "string" or t == "" then
                            if type(o.dil) == "table" then
                                t = o.dil.fallbackMarkdown
                            end
                        end
                        if type(t) == "string" and t ~= "" then
                            if not texts[o.messageId] then order[#order + 1] = o.messageId end
                            if #t >= #(texts[o.messageId] or "") then texts[o.messageId] = t end
                        end
                    end
                end
            end
            for i = #order, 1, -1 do
                local id = order[i]
                if texts[id] and #texts[id] > 0 then
                    amsg_id, atext = id, texts[id]
                    break
                end
            end

            -- 没有拿到回答就不写，避免只留下半条用户消息
            if not atext or atext == "" then return end

            local sid = ngx.ctx.sid
            local key = ngx.ctx.resume_entry_id or ngx.ctx.backend_id or convid
            -- 续聊产生的新会话 id 映射回原归档，避免历史被拆成两条
            if ngx.ctx.resume_entry_id and convid then
                ngx.shared.gpt_archive:set("alias:" .. sid .. ":" .. convid, ngx.ctx.resume_entry_id, 2592000)
            elseif ngx.ctx.backend_id then
                local a = ngx.shared.gpt_archive:get("alias:" .. sid .. ":" .. ngx.ctx.backend_id)
                if a then key = a end
            end
            if not sid or not key then return end
            local prompt = ngx.ctx.prompt or ""
            local list_key = "convs:" .. sid
            local list = {}
            local rawlist = ngx.shared.gpt_archive:get(list_key)
            if rawlist then
                local ok2, l = pcall(cjson.decode, rawlist)
                if ok2 and type(l) == "table" then list = l end
            end
            local entry
            for i, c in ipairs(list) do
                if type(c) == "table" and c.id == key then
                    entry = c
                    table.remove(list, i)
                    break
                end
            end
            if not entry then
                entry = { id = key, ts = ngx.time(), messages = {}, count = 0, title = prompt }
            end
            local now = ngx.time()
            local function upsert(id, role, text)
                for _, m in ipairs(entry.messages) do
                    if m.id == id then
                        m.content = { parts = { text } }
                        return
                    end
                end
                entry.messages[#entry.messages + 1] = {
                    id = id,
                    author = { role = role },
                    content = { parts = { text } },
                }
            end
            if prompt ~= "" then
                upsert(ngx.ctx.user_msg_id or ("u-" .. ngx.md5(tostring(now) .. prompt)), "user", prompt)
            end
            upsert(amsg_id or ("a-" .. ngx.md5(tostring(now) .. atext)), "assistant", atext)
            entry.parentId = amsg_id or entry.parentId or ngx.ctx.state_parent
            if ngx.ctx.oai_session then entry.session = ngx.ctx.oai_session end
            if ngx.ctx.affinity then entry.affinity = ngx.ctx.affinity end
            if entry.title == nil or entry.title == "" then entry.title = prompt end
            while #entry.messages > 100 do table.remove(entry.messages, 1) end
            entry.count = #entry.messages
            entry.ts = now
            table.insert(list, 1, entry)
            while #list > 20 do table.remove(list) end
            local encoded = cjson.encode(list)
            if #encoded > 900000 then
                while #list > 1 and #encoded > 900000 do
                    table.remove(list)
                    encoded = cjson.encode(list)
                end
            end
            ngx.shared.gpt_archive:set(list_key, encoded, 2592000)
        }

        proxy_pass https://$gpt_upstream;
    }

    # 官方登录 Cookie 管理（多账号）
    location = /__auth/import {
        access_log off;
        sub_filter '__gpt_noop__' '__gpt_noop__';
        content_by_lua_block {
            local f = io.open("/opt/nxpanel/auth.html", "rb")
            if not f then ngx.status = 404; return end
            ngx.header["Content-Type"] = "text/html; charset=utf-8"
            ngx.header["Cache-Control"] = "no-store"
            ngx.print(f:read("*a"))
            f:close()
        }
    }

    location = /__auth/app.js {
        access_log off;
        sub_filter '__gpt_noop__' '__gpt_noop__';
        content_by_lua_block {
            local f = io.open("/opt/nxpanel/auth.js", "rb")
            if not f then ngx.status = 404; return end
            ngx.header["Content-Type"] = "application/javascript; charset=utf-8"
            ngx.header["Cache-Control"] = "no-store"
            ngx.print(f:read("*a"))
            f:close()
        }
    }

    location = /__auth/api {
        access_log off;
        sub_filter '__gpt_noop__' '__gpt_noop__';
        client_body_buffer_size 1m;
        content_by_lua_block {
            local cjson = require("cjson")
            local sid = ngx.var.cookie_gpt_sid
            local function reply(t, code)
                ngx.status = code or 200
                ngx.header["Content-Type"] = "application/json"
                ngx.header["Cache-Control"] = "no-store"
                ngx.print(cjson.encode(t))
            end
            if not sid or sid == "" then
                reply({ ok = false, error = "缺少 gpt_sid，请先打开一次主站" }, 400)
                return
            end
            local function get_list()
                local raw = ngx.shared.gpt_archive:get("authlist:" .. sid)
                local list = {}
                if raw then
                    local ok, l = pcall(cjson.decode, raw)
                    if ok and type(l) == "table" then list = l end
                end
                if #list == 0 then
                    local old = ngx.shared.gpt_archive:get("auth:" .. sid)
                    if old then
                        local id = ngx.md5(old)
                        list = { { id = id, name = "已导入账号", ts = ngx.time(), cookie = old } }
                        ngx.shared.gpt_archive:set("authlist:" .. sid, cjson.encode(list), 15552000)
                        ngx.shared.gpt_archive:set("authactive:" .. sid, id, 15552000)
                        ngx.shared.gpt_archive:set("authcur:" .. sid, old, 15552000)
                        ngx.shared.gpt_archive:delete("auth:" .. sid)
                    end
                end
                return list
            end
            local function save_list(list)
                ngx.shared.gpt_archive:set("authlist:" .. sid, cjson.encode(list), 15552000)
            end

            local list = get_list()
            local aid = ngx.shared.gpt_archive:get("authactive:" .. sid)
            if (not aid or aid == "") and #list > 0 then
                aid = list[1].id
                ngx.shared.gpt_archive:set("authactive:" .. sid, aid, 15552000)
                ngx.shared.gpt_archive:set("authcur:" .. sid, cjson.encode({
                    cookie = list[1].cookie, auth = list[1].auth,
                    account_id = list[1].account_id, device_id = list[1].device_id,
                }), 15552000)
            end

            if ngx.req.get_method() == "GET" then
                local out = {}
                for _, p in ipairs(list) do
                    out[#out + 1] = { id = p.id, name = p.name, ts = p.ts, active = (p.id == aid) }
                end
                if #out == 0 then out = cjson.empty_array end
                reply({ ok = true, profiles = out })
                return
            end

            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            local args = {}
            if body then
                local ct = ngx.var.content_type or ""
                if ct:find("application/json", 1, true) then
                    local ok, o = pcall(cjson.decode, body)
                    if ok and type(o) == "table" then args = o end
                else
                    args = ngx.req.get_post_args()
                end
            end
            local action = args.action

            if action == "save" then
                local input = tostring(args.input or args.cookie or "")
                if #input > 30000 then reply({ ok = false, error = "内容太长" }, 400); return end
                local cookie_raw, auth, acct, dev
                if input:lower():match("^%s*curl%s") then
                    local cmd = input:gsub("\\\r?\n", " "):gsub("[\r\n]+", " ")
                    -- 按引号类型成对提取，避免 cookie 里的双引号（如 g_state={"i_l":0}）截断
                    local function flag_value(flag)
                        local i = 1
                        while true do
                            local s, e, q = cmd:find(flag .. "%s+%$?(['\"])", i)
                            if not s then return nil end
                            local vstart = e + 1
                            local vend = cmd:find(q, vstart, true)
                            if not vend then return nil end
                            return cmd:sub(vstart, vend - 1)
                        end
                    end
                    local function header(name)
                        local i = 1
                        while true do
                            local s, e, q = cmd:find("%-H%s+%$?(['\"])", i)
                            if not s then return nil end
                            local vstart = e + 1
                            local vend = cmd:find(q, vstart, true)
                            if not vend then return nil end
                            local v = cmd:sub(vstart, vend - 1)
                            local hn, hv = v:match("^([^:]+):%s*(.*)$")
                            if hn and hn:lower() == name then return hv end
                            i = vend + 1
                        end
                    end
                    cookie_raw = flag_value("%-b")
                        or flag_value("%-%-cookie")
                        or header("cookie")
                    auth = header("authorization")
                    if auth then auth = auth:match("[Bb]earer%s+(.+)$") or auth end
                    acct = header("chatgpt-account-id")
                    dev = header("oai-device-id") or header("oai-did")
                else
                    cookie_raw = input
                end
                if not cookie_raw or cookie_raw == "" then
                    reply({ ok = false, error = "没有解析到 Cookie（粘贴 Cookie 或 cURL）" }, 400)
                    return
                end
                cookie_raw = cookie_raw:gsub("[\r\n]+", " ")
                if cookie_raw:lower():match("^%s*cookie%s*:") then
                    cookie_raw = cookie_raw:sub((cookie_raw:find(":") or 0) + 1)
                end
                local out = {}
                for part in cookie_raw:gmatch("[^;]+") do
                    part = part:gsub("^%s+", ""):gsub("%s+$", "")
                    local name = part:match("^([^=]+)=")
                    if name then
                        name = name:gsub("%s+$", ""):lower()
                        if name:match("^[%w!#$%%&'*+%.%^_`|~%-]+$")
                            and name ~= "gpt_sid" and name ~= "__cf_bm" and name ~= "__cflb"
                            and name ~= "_cfuvid" and name ~= "cf_clearance" and name ~= "__cfruid" then
                            out[#out + 1] = part
                        end
                    end
                end
                local cookie = table.concat(out, "; ")
                if cookie == "" then reply({ ok = false, error = "没有解析到有效 Cookie" }, 400); return end

                local path = "/backend-api/me"
                local extra = ""
                if auth and auth ~= "" then
                    path = "/backend-api/profiles/me"
                    extra = "Authorization: Bearer " .. auth .. "\r\n"
                    if acct then extra = extra .. "chatgpt-account-id: " .. acct .. "\r\n" end
                    if dev then
                        extra = extra .. "oai-device-id: " .. dev .. "\r\n"
                            .. "oai-did: " .. dev .. "\r\n"
                    end
                end

                local sock = ngx.socket.tcp()
                sock:settimeout(15000)
                local okc, errc = sock:connect("chatgpt.com", 443)
                if not okc then
                    reply({ ok = false, error = "校验连接失败：" .. tostring(errc) }, 400)
                    return
                end
                local oks, errs = sock:sslhandshake(false, "chatgpt.com", false)
                if not oks then
                    sock:close()
                    reply({ ok = false, error = "校验 TLS 失败：" .. tostring(errs) }, 400)
                    return
                end
                local req = "GET " .. path .. " HTTP/1.1\r\nHost: chatgpt.com\r\n"
                    .. "Cookie: " .. cookie .. "\r\n" .. extra
                    .. "Accept: application/json\r\n"
                    .. "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36\r\n"
                    .. "Connection: close\r\n\r\n"
                local okq, errq = sock:send(req)
                if not okq then
                    sock:close()
                    reply({ ok = false, error = "校验发送失败：" .. tostring(errq) }, 400)
                    return
                end
                local status_line = sock:receive("*l")
                local status = status_line and tonumber(status_line:match("HTTP/%d%.%d%s+(%d+)")) or nil
                local clen, chunked = nil, false
                while true do
                    local l = sock:receive("*l")
                    if not l or l == "" then break end
                    local cl = l:match("^[Cc]ontent%-[Ll]ength:%s*(%d+)")
                    if cl then clen = tonumber(cl) end
                    if l:lower():find("transfer%-encoding:%s*chunked", 1) then chunked = true end
                end
                local body = ""
                if chunked then
                    local chunks = {}
                    while true do
                        local szline = sock:receive("*l")
                        local n = szline and tonumber(szline, 16)
                        if not n or n == 0 then break end
                        local chunk = sock:receive(n)
                        if not chunk then break end
                        chunks[#chunks + 1] = chunk
                        sock:receive(2)
                    end
                    body = table.concat(chunks)
                elseif clen and clen > 0 then
                    body = sock:receive(clen) or ""
                else
                    body = sock:receive("*a") or ""
                end
                sock:close()

                local logged, check_err = false, "Cookie/Bearer 未登录或已失效"
                if status == 200 then
                    local okj, me = pcall(cjson.decode, body)
                    if okj and type(me) == "table" then
                        -- 递归找 email / id，兼容不同返回结构
                        local email, uid, uname = "", "", ""
                        local seen, stack = {}, { { me, 0 } }
                        while #stack > 0 do
                            local item = table.remove(stack)
                            local obj, lv = item[1], item[2]
                            if type(obj) == "table" and not seen[obj] and lv <= 5 then
                                seen[obj] = true
                                for k, v in pairs(obj) do
                                    if type(v) == "table" then
                                        stack[#stack + 1] = { v, lv + 1 }
                                    elseif type(v) == "string" then
                                        if k == "email" and email == "" and v ~= "" then email = v end
                                        if (k == "id" or k == "user_id") and uid == "" and v ~= "" then uid = v end
                                        if k == "username" and uname == "" and v ~= "" then uname = v end
                                    end
                                end
                            end
                        end
                        if email ~= "" or uname ~= "" or (uid ~= "" and not uid:match("^ua%-")) then
                            logged = true
                        end
                    end
                elseif status then
                    check_err = "校验失败（HTTP " .. tostring(status) .. "）"
                else
                    check_err = "校验请求失败"
                end
                local unverified = false
                if not logged then
                    local head = body:sub(1, 180):gsub("[%c]+", " ")
                    ngx.log(ngx.ERR, "AUTHCHK status=", tostring(status),
                        " len=", #body, " chunked=", tostring(chunked),
                        " clen=", tostring(clen), " body=", body:sub(1, 600))
                    if status == 200 then
                        -- 上游已放行（200），只是返回结构没认出来：照样保存，标记未确认
                        unverified = true
                    else
                        reply({ ok = false,
                            error = check_err .. "（status=" .. tostring(status)
                                .. " len=" .. #body .. " body=" .. head .. "），未保存" }, 400)
                        return
                    end
                end

                local name = tostring(args.name or ""):gsub("^%s+", ""):gsub("%s+$", "")
                if #name > 40 then name = name:sub(1, 40) end
                local id
                for _, p in ipairs(list) do
                    if p.cookie == cookie and (p.auth or "") == (auth or "") then
                        id = p.id
                        if name ~= "" then p.name = name end
                        p.ts = ngx.time()
                        p.auth = auth
                        p.account_id = acct
                        p.device_id = dev
                        break
                    end
                end
                if not id then
                    if #list >= 10 then reply({ ok = false, error = "最多保存 10 个账号" }, 400); return end
                    id = ngx.md5(cookie .. (auth or "") .. ngx.now() .. tostring(#list))
                    if name == "" then name = "账号 " .. (#list + 1) end
                    table.insert(list, 1, {
                        id = id, name = name, ts = ngx.time(),
                        cookie = cookie, auth = auth, account_id = acct, device_id = dev,
                    })
                end
                save_list(list)
                ngx.shared.gpt_archive:set("authactive:" .. sid, id, 15552000)
                ngx.shared.gpt_archive:set("authcur:" .. sid, cjson.encode({
                    cookie = cookie, auth = auth, account_id = acct, device_id = dev,
                }), 15552000)
                reply({ ok = true, id = id,
                    warning = unverified and "已保存，但校验返回结构无法识别，请打开首页确认是否已登录" or nil })
                return
            elseif action == "use" then
                local id = args.id
                for _, p in ipairs(list) do
                    if p.id == id then
                        ngx.shared.gpt_archive:set("authactive:" .. sid, id, 15552000)
                        ngx.shared.gpt_archive:set("authcur:" .. sid, cjson.encode({
                            cookie = p.cookie, auth = p.auth,
                            account_id = p.account_id, device_id = p.device_id,
                        }), 15552000)
                        reply({ ok = true })
                        return
                    end
                end
                reply({ ok = false, error = "账号不存在" }, 404)
                return
            elseif action == "delete" then
                local id = args.id
                local removed = false
                for i, p in ipairs(list) do
                    if p.id == id then
                        table.remove(list, i)
                        removed = true
                        break
                    end
                end
                if not removed then reply({ ok = false, error = "账号不存在" }, 404); return end
                save_list(list)
                if aid == id then
                    if #list > 0 then
                        ngx.shared.gpt_archive:set("authactive:" .. sid, list[1].id, 15552000)
                        ngx.shared.gpt_archive:set("authcur:" .. sid, cjson.encode({
                            cookie = list[1].cookie, auth = list[1].auth,
                            account_id = list[1].account_id, device_id = list[1].device_id,
                        }), 15552000)
                    else
                        ngx.shared.gpt_archive:delete("authactive:" .. sid)
                        ngx.shared.gpt_archive:delete("authcur:" .. sid)
                    end
                end
                reply({ ok = true })
                return
            elseif action == "clear" then
                ngx.shared.gpt_archive:delete("authlist:" .. sid)
                ngx.shared.gpt_archive:delete("authactive:" .. sid)
                ngx.shared.gpt_archive:delete("authcur:" .. sid)
                ngx.shared.gpt_archive:delete("auth:" .. sid)
                reply({ ok = true })
                return
            end
            reply({ ok = false, error = "未知操作" }, 400)
        }
    }

    location = /__auth/clear {
        access_log off;
        content_by_lua_block {
            local sid = ngx.var.cookie_gpt_sid
            if sid then
                ngx.shared.gpt_archive:delete("authlist:" .. sid)
                ngx.shared.gpt_archive:delete("authactive:" .. sid)
                ngx.shared.gpt_archive:delete("authcur:" .. sid)
                ngx.shared.gpt_archive:delete("auth:" .. sid)
            end
            ngx.redirect("/__auth/import")
        }
    }

    # 会话归档列表（仅本机 OpenResty 提供）
    location = /__gpt/list {
        access_log off;
        sub_filter '__gpt_noop__' '__gpt_noop__';
        content_by_lua_block {
            local cjson = require("cjson")
            local sid = ngx.var.cookie_gpt_sid
            local out = {}
            local raw = sid and ngx.shared.gpt_archive:get("convs:" .. sid)
            if raw then
                local ok, l = pcall(cjson.decode, raw)
                if ok and type(l) == "table" then
                    for _, c in ipairs(l) do
                        local title = ""
                        local msgs = c.messages or {}
                        for _, m in ipairs(msgs) do
                            if m.author and m.author.role == "user"
                                and m.content and m.content.parts then
                                local t = m.content.parts[1]
                                if type(t) == "string" and t ~= "" then
                                    title = t
                                    break
                                end
                            end
                        end
                        out[#out + 1] = {
                            id = c.id,
                            ts = c.ts,
                            count = c.count or #msgs,
                            title = title,
                        }
                    end
                end
            end
            ngx.header["Content-Type"] = "application/json"
            ngx.header["Cache-Control"] = "no-store"
            ngx.print(cjson.encode({ conversations = out }))
        }
    }

    location = /__gpt/get {
        access_log off;
        sub_filter '__gpt_noop__' '__gpt_noop__';
        content_by_lua_block {
            local cjson = require("cjson")
            local sid = ngx.var.cookie_gpt_sid
            local id = ngx.var.arg_id
            local raw = sid and id and ngx.shared.gpt_archive:get("convs:" .. sid)
            if not raw then
                ngx.status = 204
                return
            end
            local ok, l = pcall(cjson.decode, raw)
            if not ok or type(l) ~= "table" then
                ngx.status = 204
                return
            end
            for _, c in ipairs(l) do
                if c.id == id then
                    ngx.header["Content-Type"] = "application/json"
                    ngx.header["Cache-Control"] = "no-store"
                    ngx.print(cjson.encode({ conversation = c }))
                    return
                end
            end
            ngx.status = 204
        }
    }

    location = /__gpt/delete {
        access_log off;
        sub_filter '__gpt_noop__' '__gpt_noop__';
        content_by_lua_block {
            local cjson = require("cjson")
            local sid = ngx.var.cookie_gpt_sid
            local id = ngx.var.arg_id
            if sid and id then
                local key = "convs:" .. sid
                local raw = ngx.shared.gpt_archive:get(key)
                if raw then
                    local ok, l = pcall(cjson.decode, raw)
                    if ok and type(l) == "table" then
                        for i, c in ipairs(l) do
                            if c.id == id then
                                table.remove(l, i)
                                break
                            end
                        end
                        ngx.shared.gpt_archive:set(key, cjson.encode(l), 2592000)
                    end
                end
            end
            ngx.header["Cache-Control"] = "no-store"
            ngx.status = 204
        }
    }

    location = /__gpt/active {
        access_log off;
        sub_filter '__gpt_noop__' '__gpt_noop__';
        content_by_lua_block {
            local sid = ngx.var.cookie_gpt_sid
            local id = ngx.var.arg_id
            if sid and id and id ~= "" then
                ngx.shared.gpt_archive:set("active:" .. sid, id, 3600)
            end
            ngx.header["Cache-Control"] = "no-store"
            ngx.status = 204
        }
    }

    location = /__gpt/clear {
        access_log off;
        sub_filter '__gpt_noop__' '__gpt_noop__';
        content_by_lua_block {
            local sid = ngx.var.cookie_gpt_sid
            if sid then
                ngx.shared.gpt_archive:delete("convs:" .. sid)
                ngx.shared.gpt_archive:delete("state:" .. sid)
            end
            ngx.header["Cache-Control"] = "no-store"
            ngx.status = 204
        }
    }

    location = /__gpt/panel.js {
        access_log off;
        content_by_lua_block {
            local f = io.open("/opt/nxpanel/nginx/chatgpt-panel.js", "rb")
            if not f then
                ngx.status = 404
                return
            end
            ngx.header["Content-Type"] = "application/javascript; charset=utf-8"
            ngx.header["Cache-Control"] = "no-store"
            ngx.print(f:read("*a"))
            f:close()
        }
    }
}
